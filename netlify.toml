# Netlify Configuration for JiPange — Next.js 14 app (web/)

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"
  # Exit 0 skips the build, non-zero runs it. base = "web" means this runs from
  # web/, while the diff paths it matches are repository-root relative — see the
  # script, which says so at the point it matters.
  ignore = "bash ../scripts/netlify-should-build.sh"

# Deploy previews are OFF, and this is the line that turns them off.
#
# Netlify was building a preview for every pull request on top of the
# production deploy for every merge — two charges per change, against a pool
# shared with Mwangaza that hit zero and left merged commits unpublished on
# both sites. Previews were roughly half of all build spend and were not being
# read: review happens through CI, local screenshots and the diff.
#
# `exit 0` cancels the build. To bring previews back, delete this block — not
# the [build] ignore above, which is a different and much cheaper saving.
[context.deploy-preview]
  ignore = "exit 0"

# Same reasoning for branch deploys. Nothing consumes them; every branch that
# matters becomes a pull request, and every pull request becomes a merge.
[context.branch-deploy]
  ignore = "exit 0"

[build.environment]
  # Pin the Node.js version to match the CI matrix and Next.js 14 requirements.
  NODE_VERSION = "22"
  # Canonical public URL — override in Netlify site settings if the domain changes.
  # This is used by the app for sitemap, robots.txt, OG images, and share links.
  NEXT_PUBLIC_SITE_URL = "https://jipangefinance.org"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for security and performance
#
# X-XSS-Protection IS DELIBERATELY ABSENT, AND ITS ABSENCE IS THE IMPROVEMENT.
#
# It used to be here as "1; mode=block". That header enabled a legacy browser
# XSS auditor which no current browser ships — Chrome removed it, Edge followed,
# and Firefox never implemented it. So on every browser a reader actually uses
# it does precisely nothing.
#
# Worse than nothing, historically: the auditor worked by guessing which parts
# of a response were reflected input and neutralising them, and that guess was
# itself exploitable — it could be induced to suppress legitimate script or to
# leak cross-origin information, which is why it was removed rather than fixed.
# Sending it signals a protection that does not exist, and a security review
# reading the header list will tick a box nothing is behind.
#
# The real mitigation is a Content-Security-Policy, and there is one below now.
#
# This note used to say there was not, on the reasoning that Next emits inline
# scripts, a correct policy therefore needs nonces threaded through the
# framework, and a wrong CSP breaks the site in production only. All three are
# true. They are also an argument about ONE directive — script-src — and
# applying it to the whole header meant the site went without object-src,
# base-uri, form-action and frame-ancestors too. Those need no nonce, break
# nothing, and block real attacks: a <base> tag repointing every relative URL,
# a form rewritten to post somewhere else, a plugin payload.
#
# script-src keeps 'unsafe-inline' and is therefore the weak line. It does not
# stop injected script. That is a smaller claim than "we have a CSP" and a
# much larger one than "we have none", and SECURITY.md says so in those words.
#
# Verified rather than reviewed: scripts/verify-csp.mjs proxies `next start`,
# stamps THIS EXACT STRING parsed from this file onto every response, and
# fails on any console violation across every route. A directive that would
# break production breaks CI instead.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'self'; \
form-action 'self'; \
img-src 'self' data: blob:; \
style-src 'self' 'unsafe-inline'; \
font-src 'self' data:; \
script-src 'self' 'unsafe-inline'; \
connect-src 'self'; \
manifest-src 'self'; \
worker-src 'self' blob:; \
upgrade-insecure-requests"""
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

name: Sync rates from Mwangaza Yield

# The T-bill figures the DhowCSD ladder projects from are published daily by
# our sister tool, which derives them from CBK auction data. This job pulls
# them into the committed snapshot the app ships (web/lib/rates-snapshot.json).
#
# It runs AFTER Mwangaza's own 6am EAT scrape so it sees the day's figures
# rather than yesterday's. The sync script refuses on anything it cannot
# verify — unknown schema, missing tenor, implausible yield or an implausible
# one-day move — and leaves the existing snapshot untouched, so a bad upstream
# day costs us freshness, never correctness.
#
# WHY IT RUNS TWICE
# -----------------
# The ordering above is an assumption about two independent cron jobs, and
# GitHub does not guarantee either fires on time — scheduled runs drift by
# hours under load. On 27 July the upstream refresh landed at 06:33 UTC, well
# after this job's 05:00, so the sync took figures two days old and nothing
# reported it. Widening the gap would only move the race; a second run late in
# the day means a delayed upstream refresh is still collected the same day.
# The real backstop is the test that fails when the shipped snapshot goes
# stale, because a job can stop firing altogether and no schedule fixes that.

on:
  schedule:
    - cron: '0 5 * * 1-5' # 8am EAT weekdays, ~2h after Mwangaza's refresh
    - cron: '0 11 * * 1-5' # 2pm EAT, for the mornings when that ordering slips
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why you are syncing off-schedule'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install once, so the suite can be run before and after the refresh
        run: cd web && npm ci

      # BASELINE, taken BEFORE the refresh — this is the whole point of the step.
      #
      # The gate below used to ask "is anything broken?" when the question it
      # means is "did the NEW data break anything?". Those are the same question
      # only while the suite is green, and this repository has guards that go red
      # on a CALENDAR: on 30 July the hand-surveyed provider yields passed their
      # 120-day budget, product-directory.test.ts went red, and it blocked the
      # T-bill refresh in both runs that day. A guard about money-market funds
      # stopped the Treasury-bill figures updating, and the only thing that
      # reported it was an email whose subject blamed the sync.
      #
      # Withholding fresh figures does not fix an aged-out survey. It just adds
      # a second problem, and the second one is invisible: the app keeps serving
      # yesterday's yields with no notice to the reader.
      - name: Record whether the suite was already failing
        id: baseline
        run: |
          if (cd web && npm run test) > /dev/null 2>&1; then
            echo "was_green=true" >> "$GITHUB_OUTPUT"
          else
            echo "was_green=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The test suite was ALREADY failing before this refresh."
          fi

      - name: Pull the published feed
        run: node scripts/sync-rates.mjs

      # The snapshot feeds a calculator, so a refresh that breaks the tests is a
      # refresh we do not ship. What decides that is the TRANSITION, not the
      # final state: green -> red is the new data breaking something and must be
      # refused; red -> red is a pre-existing failure the refresh did not cause
      # and must not be allowed to hold the data hostage.
      - name: Verify the new figures did not break anything
        id: verify
        run: |
          if (cd web && npm run test); then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.baseline.outputs.was_green }}" = "false" ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Suite still failing, but it was failing before the refresh too."
            echo "::warning::Committing the rates anyway — the failure is not caused by this data."
            exit 0
          fi
          echo "safe=false" >> "$GITHUB_OUTPUT"
          echo "::error::The suite was GREEN before this refresh and is RED after it."
          echo "::error::The new figures broke something. Discarding them; the snapshot is unchanged."
          # Leave nothing half-applied for a later step to pick up.
          git checkout -- web/lib/rates-snapshot.json
          exit 1

      # Explicit rather than relying on the previous step's exit code to halt
      # the job. A later `continue-on-error` added in good faith would otherwise
      # silently re-enable committing figures we just decided were unsafe.
      - name: Commit the refreshed snapshot
        if: steps.verify.outputs.safe == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/lib/rates-snapshot.json
          git diff --cached --quiet && { echo "rates unchanged"; exit 0; }
          git commit -m "chore(rates): refresh from Mwangaza Yield feed $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the new tip"
            git pull --rebase origin "$GITHUB_REF_NAME" || {
              echo "rebase conflicted on the snapshot — someone edited rates by hand."
              echo "NOT resolving automatically: the next run re-derives it cleanly."
              exit 1
            }
          done

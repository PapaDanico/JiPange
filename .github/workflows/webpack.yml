name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # A manual way in, for when a pull_request event does not arrive.
  #
  # THE ORIGINAL VERSION OF THIS COMMENT WAS WRONG AND IS CORRECTED HERE.
  # It said a PR that missed its event was "untestable forever" and that this
  # repository offered "no third way in". Neither is true, and the run history
  # says so plainly. What actually happened on PR #197, in order:
  #
  #   08:50  PR opened via the GitHub API      -> no run
  #   09:50  closed and reopened (`reopened`)  -> no run
  #   10:47  a commit pushed (`synchronize`)   -> run started 10:56, SUCCESS
  #
  # So a push has always been sufficient. The branch was never untestable; I
  # checked the API three minutes before that run appeared, read "nothing yet"
  # as "nothing ever", and wrote the conclusion into this file. PR #198 then
  # ran and passed the same way. Both were tested before merge, and both PR
  # descriptions claiming otherwise are wrong.
  #
  # A SECOND CORRECTION, TO THE FIRST CORRECTION. This comment initially went
  # on to say that `opened` and `reopened` never fire here and only
  # `synchronize` does, offered as a bare observation. That is wrong too.
  # PR #199 — the pull request carrying this very file — was created through
  # the same API, and its run started at 16:27:58, seconds after the PR
  # existed: build (20.x), build (22.x) and e2e, all green, all from `opened`.
  #
  # So there is no rule here to state. CI in this repository fires normally on
  # opened pull requests, including ones created through the API. PR #197's
  # missing run was a single event that did not arrive, and one occurrence is
  # not a pattern. Twice now a theory has been built out of one observation
  # and written into this file; the honest content is the run history above
  # and nothing inferred from it.
  #
  # workflow_dispatch is still worth its two lines: without it, forcing a run
  # on a stalled PR means inventing a commit for no reason other than to make
  # CI notice. It costs nothing when unused. It is a convenience, not the
  # repair of a broken repository, and should not be cited as evidence that
  # CI here is unreliable.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: cd web && npm ci

    - name: Lint
      run: cd web && npm run lint

    # Typecheck EVERYTHING, not just what next build compiles.
    #
    # `next build` typechecks the app and injects its own compiler settings, so
    # it stays green on errors in files it never compiles — lib/__tests__ above
    # all, which is where most of this project's guards now live. The only
    # typecheck in CI was typecheck:e2e, whose tsconfig includes e2e/** and
    # playwright.config.ts and nothing else.
    #
    # So the app's own sources and every unit test were unchecked. Each type
    # error caught today was caught by running tsc by hand; CI would have
    # reported none of them. The sister repository hit exactly this and left a
    # comment about it, and this one never got the lesson.
    - name: Typecheck
      run: cd web && npm run typecheck

    - name: Unit tests
      run: cd web && npm run test

    - name: Build
      run: cd web && npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: "npm"
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: cd web && npm ci

    - name: Type-check e2e specs
      run: cd web && npm run typecheck:e2e

    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(cd web && node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Chromium
      run: cd web && npx playwright install --with-deps chromium

    # Explicit build step so compile failures fail fast with readable logs
    # instead of surfacing as an opaque webServer timeout inside Playwright.
    - name: Build
      run: cd web && npm run build

    - name: E2e smoke tests
      run: cd web && npx playwright test

    # The CSP is EXERCISED, not reviewed.
    #
    # netlify.toml's own note said a wrong policy "breaks the site in
    # production only" — which is exactly why a header string cannot be signed
    # off by reading it, and why this repository shipped without one. This
    # starts the app, proxies it behind the real policy parsed from
    # netlify.toml, and fails on any console violation across every route
    # discovered from app/.
    #
    # Bounded, and deliberately without a `|| true`: a policy that breaks a
    # page must turn the run red. Chromium is installed by the step above, so
    # this must stay after it.
    - name: Verify the Content-Security-Policy against every route
      run: |
        cd web
        npm start &
        for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
        timeout -k 20s 420s npm run verify:csp

    # Upload even on success so flaky runs (fail -> pass on retry) keep
    # their traces; test-results holds the on-first-retry traces.
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          web/playwright-report
          web/test-results
        if-no-files-found: ignore
        retention-days: 7

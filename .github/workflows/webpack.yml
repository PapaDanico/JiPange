name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual trigger, because a pull request that misses its event was
  # previously untestable forever.
  #
  # PR #197 opened and no run started. Not a failure, not a skip — no run at
  # all, and the checks list simply showed Netlify's three neutral entries.
  # Closing and reopening it fired `reopened`, one of the default
  # pull_request types, and still nothing started. With only push-to-main and
  # pull_request declared here there was no third way in, so the branch could
  # not be tested by any means the repository offered.
  #
  # That is worse than a red check. A red check stops a merge; an absent one
  # looks like a PR nobody has got round to, and a reviewer scanning for red
  # sees none. The verification had to be done locally and written into the
  # PR body by hand, which nothing enforces and nobody can audit later.
  #
  # workflow_dispatch costs nothing when unused and makes the missed-event
  # case recoverable in one click.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: cd web && npm ci

    - name: Lint
      run: cd web && npm run lint

    # Typecheck EVERYTHING, not just what next build compiles.
    #
    # `next build` typechecks the app and injects its own compiler settings, so
    # it stays green on errors in files it never compiles — lib/__tests__ above
    # all, which is where most of this project's guards now live. The only
    # typecheck in CI was typecheck:e2e, whose tsconfig includes e2e/** and
    # playwright.config.ts and nothing else.
    #
    # So the app's own sources and every unit test were unchecked. Each type
    # error caught today was caught by running tsc by hand; CI would have
    # reported none of them. The sister repository hit exactly this and left a
    # comment about it, and this one never got the lesson.
    - name: Typecheck
      run: cd web && npm run typecheck

    - name: Unit tests
      run: cd web && npm run test

    - name: Build
      run: cd web && npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: "npm"
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: cd web && npm ci

    - name: Type-check e2e specs
      run: cd web && npm run typecheck:e2e

    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(cd web && node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Chromium
      run: cd web && npx playwright install --with-deps chromium

    # Explicit build step so compile failures fail fast with readable logs
    # instead of surfacing as an opaque webServer timeout inside Playwright.
    - name: Build
      run: cd web && npm run build

    - name: E2e smoke tests
      run: cd web && npx playwright test

    # The CSP is EXERCISED, not reviewed.
    #
    # netlify.toml's own note said a wrong policy "breaks the site in
    # production only" — which is exactly why a header string cannot be signed
    # off by reading it, and why this repository shipped without one. This
    # starts the app, proxies it behind the real policy parsed from
    # netlify.toml, and fails on any console violation across every route
    # discovered from app/.
    #
    # Bounded, and deliberately without a `|| true`: a policy that breaks a
    # page must turn the run red. Chromium is installed by the step above, so
    # this must stay after it.
    - name: Verify the Content-Security-Policy against every route
      run: |
        cd web
        npm start &
        for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
        timeout -k 20s 420s npm run verify:csp

    # Upload even on success so flaky runs (fail -> pass on retry) keep
    # their traces; test-results holds the on-first-retry traces.
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          web/playwright-report
          web/test-results
        if-no-files-found: ignore
        retention-days: 7

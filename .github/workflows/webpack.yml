name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: cd web && npm ci

    - name: Lint
      run: cd web && npm run lint

    - name: Unit tests
      run: cd web && npm run test

    - name: Build
      run: cd web && npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: "npm"
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: cd web && npm ci

    - name: Type-check e2e specs
      run: cd web && npm run typecheck:e2e

    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(cd web && node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Chromium
      run: cd web && npx playwright install --with-deps chromium

    # Explicit build step so compile failures fail fast with readable logs
    # instead of surfacing as an opaque webServer timeout inside Playwright.
    - name: Build
      run: cd web && npm run build

    - name: E2e smoke tests
      run: cd web && npx playwright test

    # Upload even on success so flaky runs (fail -> pass on retry) keep
    # their traces; test-results holds the on-first-retry traces.
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          web/playwright-report
          web/test-results
        if-no-files-found: ignore
        retention-days: 7
